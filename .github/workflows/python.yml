# Every tracked .py still compiles: the five patch_*.py scripts and the two
# CI checks in .github/checks/.
#
# WHY THIS LANE EARNS ITS MINUTES. patch.py, patch_web.py, patch_sdui.py,
# patch_profiles.py and patch_player_bridge.py REWRITE app.js, profile.js and
# index.html in place. They are the tool that edits the site. A SyntaxError in
# one of them is discovered halfway through a run, with the source file already
# half rewritten, and the recovery is a git checkout of whatever it touched.
# Cheaper to learn on a runner in a second or two. The two check scripts ride
# along for free: a SyntaxError in assets.py would fail its own lane with a
# traceback, but this one names the file and the line.
#
# It costs almost nothing: seven small files, the python already on the image,
# no pip install, no dependency. RE-MEASURED 2 Sep 2026 on a clean export of
# this branch's tree: 1.47 s wall clock for all seven, and `find . -name
# __pycache__` afterwards finds nothing.
#
# What it does NOT catch: whether a patch script's search-and-replace still
# finds its anchor in app.js. Those scripts are one-shot migrations that have
# already been applied, so a lane that RAN them would rewrite the site and
# then be asked to publish it. This lane parses them and stops there.
name: python

on:
  pull_request:
    paths:
      # Broad glob, because the step discovers files with `git ls-files` and a
      # new .py anywhere should be covered without anyone editing this file.
      # It is also why .github/checks/*.py are in this lane: they match.
      - '**/*.py'
      - '.github/workflows/python.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '.github/workflows/python.yml'
  workflow_dispatch:

# blazing-web is a PUBLIC repo (verified 2 Sep 2026 with `gh repo view`), so
# minutes are free. A superseded run is still cancelled: the tick on a PR
# should be the tick for the commit that is there, not an older one that
# happened to finish later.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

# READ-ONLY. GitHub Pages is LIVE on this repo from branch main at "/"
# (https://kaoz625.github.io/blazing-web/, verified 2 Sep 2026 with
# `gh api repos/Kaoz625/blazing-web/pages`), so every push to main already
# republishes the site and nothing in CI may write to the repo or deploy. A
# pull request from a fork runs with a read-only token and no secrets; nothing
# here references secrets.*.
#
# Public repo, so EVERY LOG IS WORLD-READABLE. This step prints seven file
# paths and the word ok. No environment, no HOME, no curl, nothing that could
# carry a credential.
permissions:
  contents: read

jobs:
  compile:
    name: python compile
    runs-on: ubuntu-latest
    # Measured 1.47 s. 5 minutes covers the runner and image startup and
    # still stops a hung step from sitting on the 6-hour default.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # No setup-python step on purpose. ubuntu-latest ships a python3 already,
      # these scripts declare no dependency and no version floor, and
      # setup-python is another 10-20 seconds of wall clock for nothing.
      # Proven locally on 3.11.15, 3.12.13 and 3.14.3 — all seven files
      # compile on all three, so whichever python3 the image carries is fine.
      - name: compile every tracked .py
        # MEASURED on a clean `git archive` export of this branch's tree,
        # 2 Sep 2026: 7 files, 7 ok, 0 failures, exit code 0, 1.47 s. The seven: patch.py, patch_player_bridge.py,
        # patch_profiles.py, patch_sdui.py, patch_web.py,
        # .github/checks/assets.py, .github/checks/manifests.py.
        #
        # compile() rather than `python -m py_compile`, for one specific
        # reason: py_compile WRITES __pycache__/*.pyc next to the source. That
        # is how the untracked __pycache__/ in Markus's working tree got there,
        # and build-tvs.sh's rsync exclude list does NOT name __pycache__ — so
        # bytecode left lying around gets packaged into the .ipk and .wgt that
        # ship to a television. A check has no business writing files.
        # Verified 2 Sep 2026: after this command, `find . -name __pycache__`
        # on the export finds nothing.
        #
        # Discovered with `git ls-files`, never a hardcoded list. -r stops
        # xargs running with no arguments; -n1 names the file that is actually
        # broken rather than the first of a batch; xargs propagates the
        # non-zero exit.
        run: |
          git ls-files '*.py' | xargs -r -n1 python3 -c '
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          compile(p.read_text(), str(p), "exec")
          print("ok  ", p)
          '
